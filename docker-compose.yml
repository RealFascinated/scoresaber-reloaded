version: "3.8"
services:
  postgres:
    image: postgres:18-alpine
    container_name: ssr-postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ssr_test
    ports:
      - "5433:5432"
    volumes:
      - ./projects/backend/test/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d ssr_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: ssr-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3 object store (VersityGW posix backend) — replaces the old MinIO service,
  # which has been removed from Docker Hub / ghcr.io.
  s3:
    image: versity/versitygw:v1.8.0
    container_name: ssr-s3
    # The S3 root directory is a positional arg, so the entrypoint is wrapped in
    # sh to pre-create the bucket directories first (VersityGW does not
    # auto-create buckets on first PUT, unlike MinIO). Bucket names are the
    # StorageBucket values in projects/common/src/minio-buckets.ts.
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /data/ssr-beatleader-replays /data/ssr-beatleader-score-stats && exec versitygw posix /data"]
    environment:
      VGW_PORT: ":9000"
      ROOT_ACCESS_KEY_ID: minioadmin
      ROOT_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19000:9000"
    healthcheck:
      # No /minio/health endpoint; the S3 root returns 403, so a successful TCP
      # connect is the liveness signal.
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: ./projects/backend/Dockerfile
    container_name: backend-service
    ports:
      - "127.17.0.1:7775:8080" # This maps IPv4 port for incoming connections
    networks:
      - default # For IPv4 connectivity to the container
      - ipv6-network # For outbound IPv6 connectivity
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - "traefik.http.routers.backend.rule=Host(`ssr-api.fascinated.cc`)"
      - traefik.http.routers.backend.entryPoints=http
      - traefik.http.services.backend.loadbalancer.server.port=8080
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.default.disable_ipv6=0
networks:
  default:
    driver: bridge
  ipv6-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 2001:bc8:1201:430::/64
          gateway: 2001:bc8:1201:430::1
