version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: ssr-postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ssr_test
    ports:
      - "5433:5432"
    volumes:
      - ./projects/backend/test/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d ssr_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: ssr-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: ssr-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: ./projects/backend/Dockerfile
    container_name: backend-service
    ports:
      - "127.17.0.1:7775:8080" # This maps IPv4 port for incoming connections
    networks:
      - default # For IPv4 connectivity to the container
      - ipv6-network # For outbound IPv6 connectivity
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - "traefik.http.routers.backend.rule=Host(`ssr-api.fascinated.cc`)"
      - traefik.http.routers.backend.entryPoints=http
      - traefik.http.services.backend.loadbalancer.server.port=8080
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.default.disable_ipv6=0
networks:
  default:
    driver: bridge
  ipv6-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 2001:bc8:1201:430::/64
          gateway: 2001:bc8:1201:430::1
