name: Backend Tests

on:
  push:
    branches: [master]
    paths:
      - "projects/backend/**"
      - "projects/common/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/backend-tests.yml"
      - "projects/backend/Dockerfile.test"
  pull_request:
    paths:
      - "projects/backend/**"
      - "projects/common/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/backend-tests.yml"
      - "projects/backend/Dockerfile.test"
  workflow_dispatch:

jobs:
  test:
    name: Backend test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ssr_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d ssr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MinIO has been removed from Docker Hub / ghcr.io. VersityGW (S3
      # gateway, posix filesystem backend) is a drop-in replacement that must
      # run with a positional root-dir argument, so — like MinIO — it can't be
      # a GitHub Actions service container; it's run as a step instead.
      # Bucket names are directories under /data, so the two buckets are
      # pre-created in the command (VersityGW does not auto-create on first PUT).
      - name: Start S3 (VersityGW)
        run: |
          docker run -d --name s3 \
            --entrypoint sh \
            -p 19000:9000 \
            -e ROOT_ACCESS_KEY_ID=minioadmin \
            -e ROOT_SECRET_ACCESS_KEY=minioadmin \
            -e VGW_PORT=:9000 \
            versity/versitygw:v1.8.0 \
            -c "mkdir -p /data/ssr-beatleader-replays /data/ssr-beatleader-score-stats && exec versitygw posix /data"
          # VersityGW has no dedicated /minio/health endpoint and the S3 root
          # returns 403, so a non-000 HTTP code is treated as "alive".
          for _ in $(seq 1 30); do
            http_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:19000/)
            if [ "$http_code" != "000" ]; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Build test image
        run: docker build -f projects/backend/Dockerfile.test -t ssr-backend-test .

      # Host networking makes the job's service containers (postgres 5433,
      # redis 6380, minio 19000) reachable at localhost and gives the test
      # container internet access for the live API tests. Connection targets
      # match the defaults in projects/backend/test/env.ts, so no overrides
      # are needed.
      - name: Run backend tests
        run: docker run --rm --network host ssr-backend-test

  # Deploys to Coolify only after the test suite passes. GitHub Actions
  # automatically skips a `needs` job when its dependency fails, so a red
  # suite means no deployment. Make sure the Coolify resource has auto-deploy
  # disabled so this workflow is the only thing that triggers deployments.
  deploy:
    name: Deploy to Coolify
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        run: |
          curl -sS -f -X GET "${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Accept: application/json"
